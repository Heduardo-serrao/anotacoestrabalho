<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 8px 0 16px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        button.export { background: #28a745; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

    <h2>📝 Cadastro de Pessoas</h2>
    <form id="cadastroForm">
        <label>Nome Completo:</label>
        <input type="text" id="nome" required>

        <label>Data de Nascimento:</label>
        <input type="date" id="dataNasc" required>

        <label>Telefone:</label>
        <input type="tel" id="telefone" required>

        <label>Endereço:</label>
        <input type="text" id="endereco" required>

        <label>CPF:</label>
        <input type="text" id="cpf" required>

        <button type="submit">Salvar</button>
        <button type="button" class="export" onclick="exportarCSV()">Baixar CSV</button>
    </form>

    <h2>📋 Dados Salvos</h2>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Nascimento</th>
                <th>Telefone</th>
                <th>Endereço</th>
                <th>CPF</th>
            </tr>
        </thead>
        <tbody id="tabelaDados"></tbody>
    </table>

    <script>
        const form = document.getElementById('cadastroForm');
const tabela = document.getElementById('tabelaDados');

document.addEventListener('DOMContentLoaded', carregarDados);

form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const novoRegistro = {
        nome: document.getElementById('nome').value,
        dataNasc: document.getElementById('dataNasc').value,
        telefone: document.getElementById('telefone').value,
        endereco: document.getElementById('endereco').value,
        cpf: document.getElementById('cpf').value
    };

    let lista = JSON.parse(localStorage.getItem('usuarios')) || [];
    lista.push(novoRegistro);
    localStorage.setItem('usuarios', JSON.stringify(lista));

    form.reset();
    carregarDados();
});

function carregarDados() {
    tabela.innerHTML = '';
    let lista = JSON.parse(localStorage.getItem('usuarios')) || [];
    
    lista.forEach((item, index) => {
        let dataFormatada = "";
        if (item.dataNasc) {
            const partes = item.dataNasc.split('-');
            dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        let linha = `<tr>
            <td>${item.nome}</td>
            <td>${dataFormatada}</td>
            <td>${item.telefone}</td>
            <td>${item.endereco}</td>
            <td>${item.cpf}</td>
            <td>
                <button onclick="deletarRegistro(${index})" style="background: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">
                    Excluir
                </button>
            </td>
        </tr>`;
        tabela.innerHTML += linha;
    });
}

function deletarRegistro(index) {
    if (confirm("Tem certeza que deseja excluir este cadastro?")) {
        let lista = JSON.parse(localStorage.getItem('usuarios')) || [];
        
        lista.splice(index, 1); 
        
        localStorage.setItem('usuarios', JSON.stringify(lista));
        
        carregarDados();
    }
}

function exportarCSV() {
    let lista = JSON.parse(localStorage.getItem('usuarios')) || [];
    if(lista.length === 0) return alert('Nenhum dado para exportar!');

    let csvContent = "\uFEFF"; 
    csvContent += "Nome completo,Data de nascimento,Telefone,Endereço,CPF\n";

    lista.forEach(item => {
        csvContent += `"${item.nome}","${item.dataNasc}","${item.telefone}","${item.endereco}","${item.cpf}"\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", "dados_cadastrados.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
    </script>
</body>
</html>
